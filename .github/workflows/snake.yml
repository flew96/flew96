name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # обновлять каждые 12 часов
  workflow_dispatch:          # кнопка ручного запуска
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8b5cf6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a855f7

      - name: Generate activity graph SVG
        run: node scripts/activity-graph.mjs ${{ github.repository_owner }} dist/activity-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card SVG
        run: node scripts/streak-card.mjs ${{ github.repository_owner }} dist/streak.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
